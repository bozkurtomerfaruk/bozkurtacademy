name: Exam sets
permissions:
  contents: read

on:
  # push yalnızca main'de; diğer dallar pull_request ile çalışır (aynı commit iki kez çalışmasın).
  push:
    branches: [main]
    paths: ['data/exams/**', 'js/examsData.js', 'scripts/check-exams.mjs', '.github/workflows/exam-sets.yml']
  pull_request:
    paths: ['data/exams/**', 'js/examsData.js', 'scripts/check-exams.mjs', '.github/workflows/exam-sets.yml']
# Aynı dala (PR'da head dalı, main'de main) yeni bir push gelince eski çalıştırma iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-exams.mjs
