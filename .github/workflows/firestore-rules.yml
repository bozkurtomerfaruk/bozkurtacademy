name: Firestore rules and Apps Script
permissions:
  contents: read

on:
  push:
    paths: ['firestore.rules', 'tests/**', 'scripts/placement-cleanup.mjs', 'apps-script/**', 'js/html.js', 'scripts/check-html-escape.mjs', 'package.json', 'package-lock.json', 'firebase.json', '.github/workflows/firestore-rules.yml']
  pull_request:
    paths: ['firestore.rules', 'tests/**', 'scripts/placement-cleanup.mjs', 'apps-script/**', 'js/html.js', 'scripts/check-html-escape.mjs', 'package.json', 'package-lock.json', 'firebase.json', '.github/workflows/firestore-rules.yml']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:cleanup
