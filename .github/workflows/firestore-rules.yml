name: Firestore rules and Apps Script
permissions:
  contents: read

on:
  push:
    paths: ['firestore.rules', 'tests/**', 'scripts/placement-cleanup.mjs', 'apps-script/**', 'js/html.js', 'scripts/check-html-escape.mjs', 'package.json', 'package-lock.json', 'firebase.json', '.github/workflows/firestore-rules.yml']
  pull_request:
    paths: ['firestore.rules', 'tests/**', 'scripts/placement-cleanup.mjs', 'apps-script/**', 'js/html.js', 'scripts/check-html-escape.mjs', 'package.json', 'package-lock.json', 'firebase.json', '.github/workflows/firestore-rules.yml']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:cleanup
