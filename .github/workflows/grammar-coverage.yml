name: Grammar coverage
permissions:
  contents: read

on:
  push:
    paths: ['data/**', 'scripts/check-grammar.mjs', 'scripts/build-search-index.mjs', 'scripts/sozluk.mjs', 'scripts/check-level-exams.mjs', 'scripts/check-kids-games.mjs', 'scripts/kids-audio.mjs', 'docs/sozluk-kontrol.csv', 'docs/sozluk-bekleyen.csv', '.github/workflows/grammar-coverage.yml']
  pull_request:
    paths: ['data/**', 'scripts/check-grammar.mjs', 'scripts/build-search-index.mjs', 'scripts/sozluk.mjs', 'scripts/check-level-exams.mjs', 'scripts/check-kids-games.mjs', 'scripts/kids-audio.mjs', 'docs/sozluk-kontrol.csv', 'docs/sozluk-bekleyen.csv', '.github/workflows/grammar-coverage.yml']
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-grammar.mjs
      - run: node scripts/build-search-index.mjs --check
      - run: node scripts/sozluk.mjs --check
      - run: node scripts/check-level-exams.mjs
      - run: node scripts/check-kids-games.mjs
