<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" width="560" height="342">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="342" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">A1 sınavında genellikle dört beceri ölçülür</text>
<rect class="f-bg2" x="24" y="62" width="250" height="112" rx="10"/>
<rect class="f-acc" x="24" y="62" width="8" height="112" rx="4"/>
<text class="f-acc f-serif f-b" x="48" y="100" font-size="26" text-anchor="start" lang="de">Hören</text>
<text class="f-ink f-b" x="48" y="126" font-size="18" text-anchor="start">Dinleme</text>
<text class="f-mut" x="48" y="154" font-size="18" text-anchor="start">Kısa diyalog ve anonslar</text>
<rect class="f-bg2" x="286" y="62" width="250" height="112" rx="10"/>
<rect class="f-acc" x="286" y="62" width="8" height="112" rx="4"/>
<text class="f-acc f-serif f-b" x="310" y="100" font-size="26" text-anchor="start" lang="de">Lesen</text>
<text class="f-ink f-b" x="310" y="126" font-size="18" text-anchor="start">Okuma</text>
<text class="f-mut" x="310" y="154" font-size="18" text-anchor="start">İlan, kısa e-posta, tabela</text>
<rect class="f-bg2" x="24" y="186" width="250" height="112" rx="10"/>
<rect class="f-acc" x="24" y="186" width="8" height="112" rx="4"/>
<text class="f-acc f-serif f-b" x="48" y="224" font-size="26" text-anchor="start" lang="de">Schreiben</text>
<text class="f-ink f-b" x="48" y="250" font-size="18" text-anchor="start">Yazma</text>
<text class="f-mut" x="48" y="278" font-size="18" text-anchor="start">Form doldurma, kısa mesaj</text>
<rect class="f-bg2" x="286" y="186" width="250" height="112" rx="10"/>
<rect class="f-acc" x="286" y="186" width="8" height="112" rx="4"/>
<text class="f-acc f-serif f-b" x="310" y="224" font-size="26" text-anchor="start" lang="de">Sprechen</text>
<text class="f-ink f-b" x="310" y="250" font-size="18" text-anchor="start">Konuşma</text>
<text class="f-mut" x="310" y="278" font-size="18" text-anchor="start">Tanıtma, soru sorma, rica</text>
<text class="f-mut" x="24" y="322" font-size="18" text-anchor="start">Bölüm düzeni, süre ve puanlar sınava göre değişir.</text>
</svg>
