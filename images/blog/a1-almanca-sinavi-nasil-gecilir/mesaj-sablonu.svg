<text class="f-on f-b" x="44" y="99" font-size="18" text-anchor="middle">1</text>
<rect class="f-bg2" x="74" y="62" width="462" height="60" rx="10"/>
<text class="f-mut f-b" x="90" y="86" font-size="17" text-anchor="start">Hitap</text>
<text class="f-ink" x="90" y="110" font-size="19" text-anchor="start" lang="de">Liebe Anna,</text>
<circle class="f-acc" cx="44" cy="164" r="18"/>
<text class="f-on f-b" x="44" y="171" font-size="18" text-anchor="middle">2</text>
<rect class="f-bg2" x="74" y="134" width="462" height="60" rx="10"/>
<text class="f-mut f-b" x="90" y="158" font-size="17" text-anchor="start">Neden yazıyorsun?</text>
<text class="f-ink" x="90" y="182" font-size="19" text-anchor="start" lang="de">ich habe am Samstag Geburtstag.</text>
<circle class="f-acc" cx="44" cy="236" r="18"/>
<text class="f-on f-b" x="44" y="243" font-size="18" text-anchor="middle">3</text>
<rect class="f-bg2" x="74" y="206" width="462" height="60" rx="10"/>
<text class="f-mut f-b" x="90" y="230" font-size="17" text-anchor="start">İstenen noktalar</text>
<text class="f-ink" x="90" y="254" font-size="19" text-anchor="start" lang="de">Kannst du um 18 Uhr kommen?</text>
<circle class="f-acc" cx="44" cy="308" r="18"/>
<text class="f-on f-b" x="44" y="315" font-size="18" text-anchor="middle">4</text>
