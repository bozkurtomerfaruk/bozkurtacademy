<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" width="560" height="376">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="376" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">Örnek çalışma haftası</text>
<rect class="f-acc" x="24" y="62" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="88" font-size="18" text-anchor="middle">Pazartesi</text>
<rect class="f-bg2" x="150" y="62" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="88" font-size="18" text-anchor="start">Kendini tanıtma cümleleri, sesli söyle</text>
<rect class="f-acc" x="24" y="112" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="138" font-size="18" text-anchor="middle">Salı</text>
<rect class="f-bg2" x="150" y="112" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="138" font-size="18" text-anchor="start">Soru sözcükleri: her biriyle iki soru</text>
<rect class="f-acc" x="24" y="162" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="188" font-size="18" text-anchor="middle">Çarşamba</text>
<rect class="f-bg2" x="150" y="162" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="188" font-size="18" text-anchor="start">Aile kelimeleri artikelleriyle</text>
<rect class="f-acc" x="24" y="212" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="238" font-size="18" text-anchor="middle">Perşembe</text>
<rect class="f-bg2" x="150" y="212" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="238" font-size="18" text-anchor="start">Sayılar, saat ve kısa bir dinleme</text>
<rect class="f-acc" x="24" y="262" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="288" font-size="18" text-anchor="middle">Cuma</text>
<rect class="f-bg2" x="150" y="262" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="288" font-size="18" text-anchor="start">Kısa bir mesaj yaz, kontrol et</text>
<rect class="f-acc" x="24" y="312" width="118" height="40" rx="8"/>
<text class="f-on f-b" x="83" y="338" font-size="18" text-anchor="middle">Hafta sonu</text>
<rect class="f-bg2" x="150" y="312" width="386" height="40" rx="8"/>
<text class="f-ink" x="164" y="338" font-size="18" text-anchor="start">Örnek sınavdan bir bölüm, süre tut</text>
</svg>
