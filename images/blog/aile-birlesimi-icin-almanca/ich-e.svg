<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 358" width="560" height="358">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="358" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">ich ile fiil: kök + -e</text>
<rect class="f-bg2" x="24" y="62" width="512" height="76" rx="10"/>
<text class="f-ink" x="40" y="92" font-size="19" text-anchor="start" lang="de"><tspan class="f-mut">heißen →</tspan> ich <tspan class="f-b">heiß</tspan><tspan class="f-acc f-b">e</tspan></text>
<text class="f-ink" x="40" y="120" font-size="17" text-anchor="start"><tspan lang="de" class="f-b">Ich heiße Ayşe.</tspan> · Adım Ayşe.</text>
<rect class="f-bg2" x="24" y="148" width="512" height="76" rx="10"/>
<text class="f-ink" x="40" y="178" font-size="19" text-anchor="start" lang="de"><tspan class="f-mut">kommen →</tspan> ich <tspan class="f-b">komm</tspan><tspan class="f-acc f-b">e</tspan></text>
<text class="f-ink" x="40" y="206" font-size="17" text-anchor="start"><tspan lang="de" class="f-b">Ich komme aus der Türkei.</tspan> · Türkiye’denim.</text>
<rect class="f-bg2" x="24" y="234" width="512" height="76" rx="10"/>
<text class="f-ink" x="40" y="264" font-size="19" text-anchor="start" lang="de"><tspan class="f-mut">wohnen →</tspan> ich <tspan class="f-b">wohn</tspan><tspan class="f-acc f-b">e</tspan></text>
<text class="f-ink" x="40" y="292" font-size="17" text-anchor="start"><tspan lang="de" class="f-b">Ich wohne in Ankara.</tspan> · Ankara’da oturuyorum.</text>
<text class="f-mut" x="24" y="334" font-size="18" text-anchor="start">Dikkat: sein düzensizdir → ich bin, du bist, er ist.</text>
</svg>
