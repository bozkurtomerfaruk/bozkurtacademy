<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="330" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22">Kelime sonu artikeli gösterir</text>
<rect class="f-die-bg" x="24" y="62" width="162" height="210" rx="10"/>
<rect class="f-die" x="24" y="62" width="162" height="44" rx="10"/><rect class="f-die" x="24" y="90" width="162" height="16"/>
<text class="f-on f-b" x="105" y="93" font-size="24" text-anchor="middle">die</text>
<text class="f-die f-b" x="105" y="138" font-size="20" text-anchor="middle">-ung</text>
<text class="f-die f-b" x="105" y="166" font-size="20" text-anchor="middle">-heit · -keit</text>
<text class="f-die f-b" x="105" y="194" font-size="20" text-anchor="middle">-schaft</text>
<text class="f-ink" x="105" y="236" font-size="18" text-anchor="middle" lang="de">die Zeitung</text>
<text class="f-mut" x="105" y="258" font-size="17" text-anchor="middle">gazete</text>
<rect class="f-das-bg" x="198" y="62" width="162" height="210" rx="10"/>
<rect class="f-das" x="198" y="62" width="162" height="44" rx="10"/><rect class="f-das" x="198" y="90" width="162" height="16"/>
<text class="f-on f-b" x="279" y="93" font-size="24" text-anchor="middle">das</text>
<text class="f-das f-b" x="279" y="138" font-size="20" text-anchor="middle">-chen</text>
<text class="f-das f-b" x="279" y="166" font-size="20" text-anchor="middle">-lein</text>
<text class="f-mut" x="279" y="194" font-size="17" text-anchor="middle">(küçültme)</text>
<text class="f-ink" x="279" y="236" font-size="18" text-anchor="middle" lang="de">das Mädchen</text>
<text class="f-mut" x="279" y="258" font-size="17" text-anchor="middle">kız çocuğu</text>
<rect class="f-der-bg" x="372" y="62" width="162" height="210" rx="10"/>
<rect class="f-der" x="372" y="62" width="162" height="44" rx="10"/><rect class="f-der" x="372" y="90" width="162" height="16"/>
<text class="f-on f-b" x="453" y="93" font-size="24" text-anchor="middle">der</text>
<text class="f-der f-b" x="453" y="138" font-size="20" text-anchor="middle">günler, aylar</text>
<text class="f-der f-b" x="453" y="166" font-size="20" text-anchor="middle">mevsimler</text>
<text class="f-der f-b" x="453" y="194" font-size="20" text-anchor="middle">-ismus · -ling</text>
<text class="f-ink" x="453" y="236" font-size="18" text-anchor="middle" lang="de">der Montag</text>
<text class="f-mut" x="453" y="258" font-size="17" text-anchor="middle">pazartesi</text>
<text class="f-ink" x="24" y="308" font-size="17">İpucu: Yeni kelimede önce sonuna bak.</text>
</svg>
