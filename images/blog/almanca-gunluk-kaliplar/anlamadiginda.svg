<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 354" width="560" height="354">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="354" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">Anlamadığında işini kurtaran üç cümle</text>
<rect class="f-bg2" x="24" y="62" width="512" height="70" rx="14"/>
<path class="f-bg2" d="M48 132 l0 16 l18 -16 z"/>
<text class="f-ink f-b" x="44" y="93" font-size="21" text-anchor="start" lang="de">Wie bitte?</text>
<text class="f-mut" x="44" y="119" font-size="18" text-anchor="start">Efendim? / Pardon, anlamadım?</text>
<rect class="f-bg2" x="24" y="158" width="512" height="70" rx="14"/>
<path class="f-bg2" d="M48 228 l0 16 l18 -16 z"/>
<text class="f-ink f-b" x="44" y="189" font-size="21" text-anchor="start" lang="de">Können Sie das bitte wiederholen?</text>
<text class="f-mut" x="44" y="215" font-size="18" text-anchor="start">Bunu tekrar edebilir misiniz lütfen?</text>
<rect class="f-bg2" x="24" y="254" width="512" height="70" rx="14"/>
<path class="f-bg2" d="M48 324 l0 16 l18 -16 z"/>
<text class="f-ink f-b" x="44" y="285" font-size="21" text-anchor="start" lang="de">Können Sie bitte langsamer sprechen?</text>
<text class="f-mut" x="44" y="311" font-size="18" text-anchor="start">Lütfen daha yavaş konuşabilir misiniz?</text>
</svg>
