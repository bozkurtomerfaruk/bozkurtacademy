<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" width="560" height="396">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="396" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">Resmî (Sie) ve samimi (du) söyleyiş</text>
<rect class="f-acc" x="24" y="62" width="250" height="40" rx="8"/>
<text class="f-on f-b" x="149.0" y="88" font-size="18" text-anchor="middle">Sie · resmî</text>
<rect class="f-bg2" x="286" y="62" width="250" height="40" rx="8"/>
<text class="f-ink f-b" x="411.0" y="88" font-size="18" text-anchor="middle">du · samimi</text>
<rect class="f-bg2" x="24" y="114" width="512" height="80" rx="10"/>
<text class="f-ink" x="40" y="146" font-size="19" text-anchor="start" lang="de">Wie <tspan class="f-acc f-b">heißen</tspan> Sie?</text>
<text class="f-ink" x="302" y="146" font-size="19" text-anchor="start" lang="de">Wie <tspan class="f-acc f-b">heißt</tspan> du?</text>
<line class="f-ln" x1="280" y1="126" x2="280" y2="160"/>
<text class="f-mut" x="40" y="178" font-size="18" text-anchor="start">Adınız ne? / Adın ne?</text>
<rect class="f-bg2" x="24" y="204" width="512" height="80" rx="10"/>
<text class="f-ink" x="40" y="236" font-size="19" text-anchor="start" lang="de"><tspan class="f-acc f-b">Können</tspan> Sie mir helfen?</text>
<text class="f-ink" x="302" y="236" font-size="19" text-anchor="start" lang="de"><tspan class="f-acc f-b">Kannst</tspan> du mir helfen?</text>
<line class="f-ln" x1="280" y1="216" x2="280" y2="250"/>
<text class="f-mut" x="40" y="268" font-size="18" text-anchor="start">Bana yardım edebilir misiniz / misin?</text>
<rect class="f-bg2" x="24" y="294" width="512" height="80" rx="10"/>
<text class="f-ink" x="40" y="326" font-size="19" text-anchor="start" lang="de">Auf Wiedersehen!</text>
<text class="f-ink" x="302" y="326" font-size="19" text-anchor="start" lang="de">Tschüss!</text>
<line class="f-ln" x1="280" y1="306" x2="280" y2="340"/>
<text class="f-mut" x="40" y="358" font-size="18" text-anchor="start">Hoşça kalın! / Görüşürüz!</text>
</svg>
