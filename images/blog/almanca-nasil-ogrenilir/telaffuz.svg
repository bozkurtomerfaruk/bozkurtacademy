<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 358" width="560" height="358">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="358" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">Okunuşu farklı harf grupları</text>
<rect class="f-bg2" x="24" y="64" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="40" y="108" font-size="36" text-anchor="start">ei</text>
<text class="f-mut" x="40" y="134" font-size="18" text-anchor="start">“ay” gibi</text>
<text class="f-ink" x="40" y="164" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">mein</tspan> · benim</text>
<rect class="f-bg2" x="202" y="64" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="218" y="108" font-size="36" text-anchor="start">ie</text>
<text class="f-mut" x="218" y="134" font-size="18" text-anchor="start">uzun “i”</text>
<text class="f-ink" x="218" y="164" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">vier</tspan> · dört</text>
<rect class="f-bg2" x="380" y="64" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="396" y="108" font-size="36" text-anchor="start">sch</text>
<text class="f-mut" x="396" y="134" font-size="18" text-anchor="start">“ş” gibi</text>
<text class="f-ink" x="396" y="164" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">Schule</tspan> · okul</text>
<rect class="f-bg2" x="24" y="206" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="40" y="250" font-size="36" text-anchor="start">w</text>
<text class="f-mut" x="40" y="276" font-size="18" text-anchor="start">“v” gibi</text>
<text class="f-ink" x="40" y="306" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">Wasser</tspan> · su</text>
<rect class="f-bg2" x="202" y="206" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="218" y="250" font-size="36" text-anchor="start">v</text>
<text class="f-mut" x="218" y="276" font-size="18" text-anchor="start">çoğunlukla “f”</text>
<text class="f-ink" x="218" y="306" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">Vater</tspan> · baba</text>
<rect class="f-bg2" x="380" y="206" width="164" height="128" rx="10"/>
<text class="f-acc f-serif f-b" x="396" y="250" font-size="36" text-anchor="start">z</text>
<text class="f-mut" x="396" y="276" font-size="18" text-anchor="start">“ts” gibi</text>
<text class="f-ink" x="396" y="306" font-size="19" text-anchor="start"><tspan class="f-b" lang="de">Zeit</tspan> · zaman</text>
</svg>
