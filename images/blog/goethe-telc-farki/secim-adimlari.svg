<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 378" width="560" height="378">
<style>
.f-bg{fill:#f3f0e8}.f-bg2{fill:#e6e1d5}.f-gr{fill:#ddd6c6}.f-ink{fill:#2a2a26}.f-mut{fill:#55534a}
.f-acc{fill:#45572f}.f-on{fill:#ffffff}.f-der{fill:#2c5f9e}.f-die{fill:#a3352c}.f-das{fill:#35703e}
.f-der-bg{fill:#dbe5f1}.f-die-bg{fill:#f4e0dc}.f-das-bg{fill:#dde9d7}.f-ln{fill:none;stroke:#857d6b;stroke-width:2}
.f-ln-acc{fill:none;stroke:#45572f;stroke-width:3}
text{font-family:"Albert Sans",system-ui,sans-serif}.f-serif{font-family:"STIX Two Text",Georgia,serif}.f-b{font-weight:600}
</style>
<rect class="f-bg" width="560" height="378" rx="14"/>
<text class="f-ink f-b" x="24" y="42" font-size="22" text-anchor="start">Seçim yaparken bu sırayla düşün</text>
<circle class="f-acc" cx="44" cy="94" r="18"/>
<text class="f-on f-b" x="44" y="101" font-size="18" text-anchor="middle">1</text>
<rect class="f-bg2" x="74" y="62" width="462" height="64" rx="10"/>
<text class="f-ink f-b" x="90" y="89" font-size="18" text-anchor="start">Belgeyi nereye vereceksin?</text>
<text class="f-mut" x="90" y="113" font-size="18" text-anchor="start">Kabul edilen sınavları resmî sayfadan kontrol et.</text>
<line class="f-ln" x1="44" y1="112" x2="44" y2="138"/>
<circle class="f-acc" cx="44" cy="170" r="18"/>
<text class="f-on f-b" x="44" y="177" font-size="18" text-anchor="middle">2</text>
<rect class="f-bg2" x="74" y="138" width="462" height="64" rx="10"/>
<text class="f-ink f-b" x="90" y="165" font-size="18" text-anchor="start">Ne zamana kadar gerekiyor?</text>
<text class="f-mut" x="90" y="189" font-size="18" text-anchor="start">Yakın sınav merkezlerinde uygun tarihe bak.</text>
<line class="f-ln" x1="44" y1="188" x2="44" y2="214"/>
<circle class="f-acc" cx="44" cy="246" r="18"/>
<text class="f-on f-b" x="44" y="253" font-size="18" text-anchor="middle">3</text>
<rect class="f-bg2" x="74" y="214" width="462" height="64" rx="10"/>
<text class="f-ink f-b" x="90" y="241" font-size="18" text-anchor="start">Hangi bölümde güçlüsün?</text>
<text class="f-mut" x="90" y="265" font-size="18" text-anchor="start">Görev türlerini karşılaştır.</text>
<line class="f-ln" x1="44" y1="264" x2="44" y2="290"/>
<circle class="f-acc" cx="44" cy="322" r="18"/>
<text class="f-on f-b" x="44" y="329" font-size="18" text-anchor="middle">4</text>
<rect class="f-bg2" x="74" y="290" width="462" height="64" rx="10"/>
<text class="f-ink f-b" x="90" y="317" font-size="18" text-anchor="start">Örnek setleri dene</text>
<text class="f-mut" x="90" y="341" font-size="18" text-anchor="start">İki sınavdan da birer örnek çöz.</text>
</svg>
